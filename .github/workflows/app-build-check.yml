# v20.0.46 r1 — the served app page must be exactly what its source builds to.
# Vercel serves public/app/index.html as committed (no build step), so a source edit that was
# never rebuilt, or a hand edit to the generated page, would deploy silently. This check fails
# the pull request (or flags main) when that happens. It writes nothing and needs no secrets.
name: App build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install esbuild (the version the build pins)
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2
      - name: public/app/index.html matches app-src/index.src.html
        run: node tools/build-app.mjs --check
